[workspace]
members = [
    "crates/dye-app",
    "crates/dye-core",
    "crates/dye-engine",
    "crates/dye-net",
    "crates/dye-opt",
    "crates/dye-render",
    "crates/dye-assets",
    "crates/dye-wgpu",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
dye-app = { path = "crates/dye-app" }
dye-assets = { path = "crates/dye-assets" }
dye-core = { path = "crates/dye-core" }
dye-engine = { path = "crates/dye-engine" }
dye-net = { path = "crates/dye-net" }
dye-opt = { path = "crates/dye-opt" }
dye-render = { path = "crates/dye-render" }
dye-wgpu = { path = "crates/dye-wgpu" }

bytemuck = "1.25.2"
clap = { version = "4.6.8", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
fnv = "1.0.7"
glam = "0.34.3"
include_dir = "0.7.4"
pollster = "1.0.1"
png = "0.18.1"
raw-window-handle = "0.6.2"
semver = { version = "1.0.28", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
thiserror = "2.0.21"
toml = "1.2.1"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
wgpu = { version = "30.0.2", default-features = false, features = [
    "std", "vulkan", "metal", "dx12", "gles", "wgsl"
    ] }
winit = "0.30.13"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
debug = true

[profile.github-ci]
inherits = "dev"
strip = "symbols"
debug = false
opt-level = 3

[package]
name = "dye-bin"
version.workspace = true
edition.workspace = true

[dependencies]
dye-app.workspace = true
dye-assets.workspace = true
dye-core.workspace = true
dye-opt.workspace = true
dye-render.workspace = true
dye-wgpu.workspace = true

clap.workspace = true
include_dir.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true